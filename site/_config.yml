# CTFWU custom interface. The generator builds separate VI and EN trees.
lang: vi-VN
timezone: Asia/Ho_Chi_Minh
title: CTFWU
tagline: "Writeup CTF của tinhatinh, đội R3:TURИ"
description: "Writeup CTF của Phan Thành Danh: phân tích, kiểm chứng và tái hiện lời giải."
url: "https://tinhatinh.github.io"
baseurl: "/CTFWU"

social:
  name: Phan Thành Danh
  email: ptdanh007@gmail.com
  links:
    - https://github.com/tinhatinh
    - https://ctftime.org/team/449538

plugins:
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
