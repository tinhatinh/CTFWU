<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Thiên Môn và Vân Hải">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.38" stop-color="#0e1926"/>
      <stop offset="0.72" stop-color="#172432"/>
      <stop offset="1" stop-color="#060a10"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.64" cy="0.38" r="0.46">
      <stop offset="0" stop-color="#fff0bc" stop-opacity="0.58"/>
      <stop offset="0.28" stop-color="#e3be6d" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#c9a24d" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGate" x1="0" y1="0" x2="0" y2="1">
