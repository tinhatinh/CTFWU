      <stop offset="0.5" stop-color="#c9a24d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0d1621" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2b8" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#9fb4b2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#060a10" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060a10" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#e5cd92" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#cfe0dc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#060a10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
