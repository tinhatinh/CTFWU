<a class="writeup-row" href="{{ post.url | relative_url }}" data-category="{{ post.primary_category | escape }}" data-categories="{{ post.categories | jsonify | escape }}" data-event="{{ post.event_name | escape }}" data-date="{{ post.date | date: '%s' }}" data-title="{{ post.challenge_name | default: post.title | escape }}" data-search="{{ post.search_text | escape }}">
  <div class="row-name"><span class="row-number mono">{{ forloop.index | prepend: '00' | slice: -2, 2 }}</span><div><h3>{{ post.challenge_name | default: post.title }}</h3>{% if post.difficulty != '' %}<span class="row-difficulty">{{ post.difficulty }}</span>{% endif %}</div></div><span class="category-pill">{{ post.primary_category }}</span><span class="row-event">{{ post.event_name }}</span><time class="mono" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d.%m.%Y' }}</time><span class="row-arrow" aria-hidden="true">↗</span>
</a>
