<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteCheck // Orbital Diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="starfield"></div>
<header class="topbar">
  <a class="brand" href="/dashboard">
    <span class="brand-mark">◉</span> SiteCheck
    <span class="brand-sub">ORBITAL DIAGNOSTICS · EST. 2062</span>
  </a>
  <nav class="topnav">
    
      <a href="/login">Sign In</a>
      <a href="/register">Enlist</a>
    
  </nav>
</header>
<main class="shell">

<section class="panel narrow">
  <div class="panel-glow"></div>
  <h1 class="display">Enlist with the Fleet</h1>
  <p class="lede">Every inspector gets a personnel file and a personal diagnostics console.</p>
  
  <form action="/register" method="post" class="stack">
    <label>Callsign<input name="username" autocomplete="username" required></label>
    <label>Passphrase<input name="password" type="password" autocomplete="new-password" required></label>
    <button class="btn primary" type="submit">Request Clearance ▸</button>
  </form>
  <p class="muted">Already enlisted? <a href="/login">Sign in</a>.</p>
</section>
</main>
<footer class="footer">
  <span>SiteCheck Fleet Services</span>
  <span class="tick">▲ ALL SYSTEMS NOMINAL ▲</span>
  <span>© 2062 Spacely Web Sprockets, Inc.</span>
</footer>
</body>
</html>
