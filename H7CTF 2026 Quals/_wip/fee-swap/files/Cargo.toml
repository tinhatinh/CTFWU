[package]
name = "fee_swap"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
solana-program = "3.0"
spl-token-2022 = { version = "11", default-features = false, features = ["no-entrypoint"] }
borsh = "1.5"
borsh-derive = "1.5"

[dev-dependencies]
spl-token-2022 = "11"
solana-program-test = "3.0"
solana-sdk = "3.0"
solana-system-interface = "3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
crate-type = ["cdylib", "lib"]
