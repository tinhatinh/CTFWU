name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # 07:00 and 19:00 in UTC+7 (GitHub schedules use UTC).
    - cron: '0 0,12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Refresh CTFTime results
        id: ctftime
        continue-on-error: true
        run: python3 tools/fetch_ctftime.py

      - name: Keep the verified CTFTime snapshot
        if: steps.ctftime.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          if ! git diff --quiet -- tools/ctftime_team.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/ctftime_team.json
            git commit -m "Update CTFTime team results"
            git push
          fi

      - name: Assemble site sources (vi + en)
        run: python3 tools/build_site.py

      - name: Check editor data integrity and CTFTime parser
        run: |
          python3 tools/test_editor.py
          node tools/test_github_editor.cjs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site (Vietnamese + English trees)
        env:
          JEKYLL_ENV: "production"
        run: |
          bundle exec jekyll b -s _site_src    -d _build/vi/CTFWU
          bundle exec jekyll b -s _site_src_en -d _build/en/CTFWU/en
          mkdir -p _site/CTFWU
          cp -r _build/vi/CTFWU/. _site/CTFWU/
          cp -r _build/en/CTFWU/en _site/CTFWU/

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
